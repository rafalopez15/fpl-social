# Every day, fetches production fplAPI responses and checks the app's models
# still decode them, so a backend change that breaks the app fails here instead
# of on a phone. GitHub emails the failure of a scheduled run.

name: API contract

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Decode production responses
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v5

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    # Restore only: the iOS workflow saves these, from a fuller build than this one.
    - name: Key the build caches
      # Build products from another Xcode can't be reused, so its version and build
      # number (e.g. Xcode-26.1-17B55) are in the keys.
      run: echo "XCODE_VERSION=$(xcodebuild -version | tr '\n' ' ' | sed 's/Build version //; s/ *$//; s/ /-/g')" >> "$GITHUB_ENV"

    - name: Restore the Swift packages
      # Cloned once per Package.resolved instead of on every run.
      uses: actions/cache/restore@v4
      with:
        path: SourcePackages
        key: spm-${{ runner.os }}-${{ hashFiles('FPL.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

    - name: Restore the build products
      # Mostly the packages' (supabase-swift, swift-crypto), which take minutes to
      # compile and only change with Package.resolved. The app's own files still
      # build each run: checkout gives them new timestamps.
      uses: actions/cache/restore@v4
      with:
        # Not the index or logs, which CI never reads.
        path: |
          DerivedData
          !DerivedData/Index.noindex
          !DerivedData/Logs
        # The runner image too: an SDK or simulator update leaves a stale module cache
        # behind the same Xcode version, which fails builds.
        key: deriveddata-${{ runner.os }}-${{ env.ImageVersion }}-${{ env.XCODE_VERSION }}-${{ hashFiles('FPL.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

    - name: Pick an iPhone simulator
      run: |
        UDID=$(xcrun simctl list devices available --json \
          | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                    | select(.name | startswith("iPhone"))] | last | .udid')
        if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
          echo "No iPhone simulator available" >&2
          xcrun simctl list devices available
          exit 1
        fi
        echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

    - name: Fetch production responses
      # Replaces the committed fixtures for this run only.
      run: .github/scripts/fetch_contract_fixtures.sh https://fpl-api-six.vercel.app/api

    - name: Decode them
      run: |
        xcodebuild test \
          -project FPL.xcodeproj \
          -scheme FPL \
          -destination "id=$SIMULATOR_UDID" \
          -derivedDataPath DerivedData \
          -clonedSourcePackagesDirPath SourcePackages \
          COMPILER_INDEX_STORE_ENABLE=NO \
          -only-testing:FPLTests/ContractTests \
          -parallel-testing-enabled NO \
          -enableCodeCoverage NO \
          -resultBundlePath Contract.xcresult \
          CODE_SIGNING_ALLOWED=NO

    - name: Summarize
      if: always()
      run: python3 .github/scripts/summarize_xcresult.py Contract.xcresult contract-summary.md
