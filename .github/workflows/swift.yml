# Builds the FPL iOS app and runs its unit tests on an iOS simulator.

name: iOS

on:
  push:
    branches: [ "main" ]
    paths:
      - "FPL/**"
      - "FPLTests/**"
      - "FPL.xcodeproj/**"
      - ".github/workflows/swift.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "FPL/**"
      - "FPLTests/**"
      - "FPL.xcodeproj/**"
      - ".github/workflows/swift.yml"

jobs:
  test:
    # The app uses iOS 26 SDK APIs, so it needs Xcode 26 or later.
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Pick an iPhone simulator
      run: |
        UDID=$(xcrun simctl list devices available --json \
          | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                    | select(.name | startswith("iPhone"))] | last | .udid')
        if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
          echo "No iPhone simulator available" >&2
          xcrun simctl list devices available
          exit 1
        fi
        echo "Using simulator $UDID"
        echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

    - name: Build and run unit tests
      run: |
        xcodebuild test \
          -project FPL.xcodeproj \
          -scheme FPL \
          -destination "id=$SIMULATOR_UDID" \
          -only-testing:FPLTests \
          CODE_SIGNING_ALLOWED=NO
